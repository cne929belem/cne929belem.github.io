# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: cne929belem/cne929belem.github.io
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/960f7679-5e07-43aa-b176-a32c0b0faa81/pkce
  auth_token_endpoint: /sites/960f7679-5e07-43aa-b176-a32c0b0faa81/token
  gateway_url: https://gateway.decapbridge.com
  # Ver quem fez o quê (opcional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Campos PKCE (opcional, recomendado)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Logótipo Decap + Bridge (opcional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Link do site no Decap CMS (opcional)
site_url: https://cne929belem.github.io

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "paginas"
    label: "Páginas do Site"
    files:
      - label: "ACAGRUP 2026 - Ilha dos Cavalos"
        name: "acagrup-2026"
        file: "acagrup-2026.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}
          
      - label: "Documentos do Agrupamento"
        name: "documentos"
        file: "documentos.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - label: "Promessas 2026"
        name: "promessas"
        file: "promessas26.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}
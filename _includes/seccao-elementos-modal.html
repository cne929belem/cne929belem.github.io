<div id="{{ include.id }}" class="css-lightbox seccao-elementos-modal" style="--cor-seccao: {{ page.seccao_cor }};" role="dialog" aria-modal="true" aria-labelledby="{{ include.id }}-titulo">
    <div class="css-lightbox-box">
        <div class="css-lightbox-header" id="{{ include.id }}-titulo">{{ include.nome }}</div>
        <div class="css-lightbox-body">
            <p class="seccao-elementos-intro">Espaços reservados para a fotografia, o nome e o tótem dos elementos.</p>
            <div class="seccao-elementos-grelha">
                {% for elemento in (1..8) %}
                <div class="seccao-elemento">
                    <div class="seccao-elemento-foto" aria-label="Espaço para fotografia">📷</div>
                    <span class="seccao-elemento-nome">Elemento {{ elemento }}</span>
                    <span class="seccao-elemento-totem">Nome · Totem</span>
                </div>
                {% endfor %}
            </div>
            <a href="#" class="btn css-lightbox-close">Fechar</a>
        </div>
    </div>
</div>

backend:
  name: git-gateway
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/960f7679-5e07-43aa-b176-a32c0b0faa81/pkce
  auth_token_endpoint: /sites/960f7679-5e07-43aa-b176-a32c0b0faa81/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://cne929belem.github.io

# editorial_workflow: cada alteração feita no painel fica como "rascunho"
# (Pull Request no GitHub), com estados Rascunho → Em Revisão → Pronto a
# Publicar, em vez de ir direto para o site. Dá controlo antes de algo
# ficar visível ao público. Os estados/fluxo exato ficam por definir.
publish_mode: editorial_workflow

media_folder: "assets/img"
public_folder: "/assets/img"

# =========================================================================
# Há quatro tipos de conteúdo geridos aqui:
# 1. "paginas" — páginas simples e soltas. Conteúdo livre.
# 2. Coleções ("noticias", "documentos", "inscricoes") — conteúdo repetido,
#    cada entrada vira um ficheiro novo na respetiva pasta _..., e as
#    páginas de listagem organizam-nas sozinhas.
# 3. "dados" — a base de registos de Noites/Horas (_data/registos.yml).
# =========================================================================
collections:
  - name: "paginas"
    label: "Páginas do Site"
    files:
      - label: "ACAGRUP 2026 - Ilha dos Cavalos"
        name: "acagrup-2026"
        file: "atividades/acagrup-2026.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - label: "Documentos do Agrupamento"
        name: "documentos"
        file: "agrupamento/documentos.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - label: "Promessas 2026"
        name: "promessas"
        file: "atividades/promessas26.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - label: "A Nossa Equipa"
        name: "equipa"
        file: "agrupamento/equipa.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - label: "Informações"
        name: "informacoes"
        file: "agrupamento/informacoes.md"
        fields:
          - {label: "Título da Página", name: "title", widget: "string"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown"}

      - label: "Diário de Bordo (Comunidade)"
        name: "comunidade_diario"
        file: "comunidade/diario.md"
        fields:
          - {label: "ID da Pasta de Documentos", name: "pasta_documentos", widget: "string", hint: "Apenas o ID da pasta do Google Drive"}
          - {label: "ID da Pasta de Imagens", name: "pasta_imagens", widget: "string", hint: "Apenas o ID da pasta do Google Drive"}
          - {label: "Título da Página", name: "title", widget: "hidden", default: "Diário de Bordo | IV - Comunidade"}
          - {label: "Classe CSS (Não mexer)", name: "main_class", widget: "hidden", default: "main-content"}
          - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "default"}
          - {label: "Conteúdo da Página", name: "body", widget: "markdown", required: false}

  - name: "noticias"
    label: "Notícias"
    folder: "_noticias"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout (Não mexer)", name: "layout", widget: "hidden", default: "noticia"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Resumo (aparece no cartão)", name: "resumo", widget: "text"}
      - {label: "Imagem (opcional)", name: "imagem", widget: "image", required: false}
      - {label: "Link direto para outra página (opcional)", name: "link_externo", widget: "string", required: false, hint: "Se preenchido, o cartão liga diretamente para aqui em vez de criar uma página de notícia própria."}
      - {label: "Texto completo (só se NÃO preencheres o link direto)", name: "body", widget: "markdown", required: false}

  - name: "documentos"
    label: "Documentos"
    folder: "_documentos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descrição", name: "descricao", widget: "string"}
      - {label: "Ficheiro PDF", name: "ficheiro", widget: "file", required: false, media_folder: "/assets/docs", public_folder: "/assets/docs", hint: "Deixa vazio se o documento ainda não existir (aparece como 'brevemente')."}
      - {label: "Ano (ou 'Geral')", name: "ano", widget: "string", default: "Geral"}
      - {label: "Estado", name: "estado", widget: "select", options: ["disponivel", "brevemente"], default: "brevemente"}
      - {label: "Ordem dentro do grupo", name: "ordem", widget: "number", default: 1, required: false}

  - name: "inscricoes"
    label: "Inscrições"
    folder: "_inscricoes"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nome da Atividade", name: "title", widget: "string"}
      - {label: "Descrição breve", name: "descricao", widget: "text"}
      - {label: "Link do Google Forms", name: "form_url", widget: "string"}
      - {label: "Ativo (aparece na página de Inscrições?)", name: "ativo", widget: "boolean", default: true}
      - {label: "Data limite (opcional, texto livre)", name: "data_limite", widget: "string", required: false}

  - name: "dados"
    label: "Bases de Dados"
    files:
      - label: "Registo de Noites e Horas"
        name: "registos_escuteiros"
        file: "_data/registos.yml"
        fields:
          - label: "Elementos do Agrupamento"
            name: "elementos"
            widget: "list"
            fields:
              - {label: "NIN (Usado para pesquisa)", name: "nin", widget: "string"}
              - {label: "Nome Completo", name: "nome", widget: "string"}
              - {label: "Tótem (Usado para pesquisa)", name: "toten", widget: "string"}
              - {label: "Data de Admissão", name: "data_admissao", widget: "string", required: false, hint: "Formato DD/MM/AAAA"}
              - {label: "Data de Promessa", name: "data_promessa", widget: "string", required: false, hint: "Formato DD/MM/AAAA — deixa vazio se ainda não fez Promessa"}
              - {label: "Sexo", name: "sexo", widget: "select", options: ["M", "F"]}
              - {label: "Categoria", name: "categoria", widget: "string", hint: "Ex.: Lobito, Aspirante a Lobito, Dirigente..."}
              - {label: "Secção", name: "seccao", widget: "string", hint: "Ex.: Lobitos, Exploradores / Moços, Dirigentes..."}
              - {label: "Noites de Campo", name: "noites", widget: "number", value_type: "int", default: 0}
              - {label: "Horas de Mar", name: "horas", widget: "number", value_type: "int", default: 0}

name: CNE 929 Belém
description: Portal oficial do Agrupamento 929 - Belém, do Corpo Nacional de Escutas.
url: "https://cne929belem.github.io"
markdown: kramdown

# =========================================================================
# COLEÇÕES — grupos de conteúdo geridos como "ficheiros repetíveis", em vez
# de páginas soltas. Cada coleção fica na sua própria pasta (_noticias/,
# _documentos/, _inscricoes/), e o Jekyll junta-os automaticamente para os
# podermos listar ou ordenar por data. As notícias alimentam o feed da
# página inicial (index.md); os documentos aparecem em
# agrupamento/documentos.md; as inscrições em atividades/inscricoes.md.
# Ver README.md, secção "Como acrescentar conteúdo", para o passo-a-passo.
# =========================================================================
collections:
  noticias:
    output: false              # sem página própria — alimentam só o feed da página inicial (index.md)
  documentos:
    output: false              # os documentos não têm página própria — só aparecem listados em agrupamento/documentos.md
  inscricoes:
    output: false              # as inscrições não têm página própria — só aparecem listadas em atividades/inscricoes.md

# =========================================================================
# PLUGINS — jekyll-sitemap é suportado nativamente pelo GitHub Pages.
# Gera /sitemap.xml e, como não existe robots.txt no repositório, também
# /robots.txt a apontar para o sitemap. Páginas com `sitemap: false` ficam
# de fora (ver "defaults" abaixo).
# =========================================================================
plugins:
  - jekyll-sitemap

# =========================================================================
# EXCLUSÕES — ficheiros do repositório que NÃO devem ser publicados no site.
# No GitHub Pages, os .md sem front matter também são convertidos em páginas
# (plugin jekyll-optional-front-matter); sem esta lista, o README e os
# ficheiros de governação apareciam como páginas públicas. A lista repete as
# exclusões por omissão do Jekyll (Gemfile, vendor…) por segurança.
# =========================================================================
exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - SECURITY.md
  - ACCESSIBILITY.md
  - AUDITORIA.md
  - jamboree/inscricao.html
  - LICENSE
  - firestore.rules
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .github/
  - .jekyll-cache/
  - .sass-cache/
  - apps-script/

# =========================================================================
# PREDEFINIÇÕES — páginas que não devem entrar no sitemap. As páginas da
# Área Pessoal já têm `robots: noindex` no front matter; isto só evita que o
# sitemap as anuncie. NÃO é controlo de acesso. A pasta jamboree/ não é
# configurada aqui de propósito (não se altera nada do Jamboree).
# =========================================================================
defaults:
  - scope:
      path: "escuteiro"
    values:
      sitemap: false
  - scope:
      path: "em-construcao.md"
    values:
      sitemap: false

# =========================================================================
# TESTE DAS PROMESSAS — endereço do Web App (Apps Script) que identifica,
# corrige e regista os testes. O URL /exec é público por natureza (como o do
# acesso à Área Pessoal); não é um segredo. Deixar vazio até o Apps Script
# estar publicado e testado: o site mostra «teste ainda não disponível».
# Ver apps-script/teste-promessas/LEIA-ME.md.
# =========================================================================
teste_promessas:
  endpoint: ""
  duracao_minutos: 30

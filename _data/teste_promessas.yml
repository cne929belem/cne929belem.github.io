# =========================================================================
# TESTE DAS PROMESSAS — perguntas e opções (SEM chave de respostas)
# -------------------------------------------------------------------------
# Fonte única das perguntas do teste teórico, usadas pelo componente
# _includes/teste-promessas.html nas quatro páginas de Vivência.
#
# A CHAVE DE RESPOSTAS NÃO ESTÁ AQUI. Este repositório é público: a resposta
# correta e a aprovação de cada pergunta vivem na Google Sheet privada do
# Agrupamento (aba «Chave»). Só as perguntas com aprovada = TRUE nessa aba
# entram no teste — o servidor (Apps Script) decide e corrige.
#
# Regras para quem edita:
#   - Cada pergunta nasce de um cartão de estudo existente (campo `fonte`).
#     Não acrescentar factos que não estejam no conteúdo de estudo.
#   - Não mudar o `id` de uma pergunta nem das opções sem atualizar a aba
#     «Chave» da Sheet (o servidor compara os ids).
#   - `revisao: duvidosa` = a resposta certa não é inequívoca a partir do
#     conteúdo atual. Fica fora do teste até a Equipa de Animação decidir.
#   - Ver apps-script/teste-promessas/LEIA-ME.md (lista de revisão pedagógica).
# =========================================================================

aviso_teorico: >-
  Este teste avalia apenas conhecimentos teóricos. As provas técnicas são avaliadas em
  atividade em conjunto com a Equipa de Animação e não são avaliadas por este teste.

percursos:
  movimento: "Adesão ao Movimento"
  seccao: "Adesão à Secção"

# Títulos dos percursos por secção. `disponivel: false` mostra o percurso
# desativado, com a nota, mesmo que haja perguntas aprovadas na Sheet.
seccoes:
  alcateia:
    nome: "Alcateia 102"
    elementos: "Lobitos"
    movimento:
      titulo: "Adesão ao Movimento"
      disponivel: false
      nota: >-
        Na Alcateia há um só percurso: o Caderno de Pista I junta numa lista única o que o
        Pata-Tenra deve saber (Lei, Máximas, Divisa, oração, Bando, Caçada…). Escolhe «Adesão à Alcateia 102».
    seccao:
      titulo: "Adesão à Alcateia 102"
      disponivel: true
  flotilha:
    nome: "Flotilha 110"
    elementos: "Moços"
    movimento: { titulo: "Adesão ao Movimento", disponivel: true }
    seccao: { titulo: "Adesão à Secção — A Flotilha 110", disponivel: true }
  frota:
    nome: "Frota 98"
    elementos: "Marinheiros"
    movimento: { titulo: "Adesão ao Movimento", disponivel: true }
    seccao: { titulo: "Adesão à Secção — A Frota", disponivel: true }
  comunidade:
    nome: "Comunidade 88"
    elementos: "Companheiros"
    movimento: { titulo: "Adesão ao Movimento", disponivel: true }
    seccao: { titulo: "Adesão à Secção — A Comunidade", disponivel: true }


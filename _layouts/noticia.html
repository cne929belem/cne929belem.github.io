---
layout: default
main_class: main-content
---
{% comment %}
  Layout para uma notícia individual (usado por qualquer ficheiro em _noticias/).
{% endcomment %}
<div class="content-wrapper" style="justify-content: center; align-items: center; flex-direction: column;">
    <article class="card" style="max-width: 800px; width: 100%; text-align: left;">
        <p style="text-align: left;"><a href="{{ '/noticias.html' | relative_url }}" style="color: var(--azul-claro); text-decoration: none; font-size: 0.9rem;">← Voltar a Notícias</a></p>

        {% if page.imagem %}
        <img src="{{ page.imagem | relative_url }}" alt="{{ page.title }}" style="width: 100%; height: auto; border-radius: 8px; margin-bottom: 20px;">
        {% endif %}

        <h1>{{ page.title }}</h1>
        <p style="color: #888; font-size: 0.85rem; margin-top: -10px;">{{ page.date | date: "%d de %B de %Y" }}</p>

        <div class="noticia-corpo">
            {{ content }}
        </div>
    </article>
</div>
